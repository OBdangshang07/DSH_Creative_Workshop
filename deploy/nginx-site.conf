limit_req_zone $binary_remote_addr zone=dsh_auth:10m rate=10r/m;

server {
    server_name xxnmkk.xyz www.xxnmkk.xyz;

    root /var/www/dsh-workshop/current;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"ok":true,"service":"dsh-creative-workshop-web"}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/v1/auth/(?:login|register)$ {
        limit_req zone=dsh_auth burst=8 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 40s;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /js/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ ^/(?:login|admin)/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/xxnmkk.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xxnmkk.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name xxnmkk.xyz www.xxnmkk.xyz;
    return 301 https://$host$request_uri;
}
